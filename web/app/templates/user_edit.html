{% extends 'base.html' %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-3">
    <h2 class="mb-0">Editar Usuário</h2>
    {% if user.role == 'admin' %}
    <span class="badge text-bg-dark">Admin</span>
    {% else %}
    <span class="badge text-bg-secondary">Usuário comum</span>
    {% endif %}
</div>
<form method="post" action="/usuarios/{{ user.id }}/editar" class="ajax">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input name="name" class="form-control" value="{{ user.name }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input name="email" class="form-control" type="email" value="{{ user.email }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Perfil</label>
        <input name="role" class="form-control" value="{{ user.role }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Status ativo</label>
        <select name="is_active_account" class="form-select">
            <option value="true" {% if user.is_active_account %}selected{% endif %}>Ativo</option>
            <option value="false" {% if not user.is_active_account %}selected{% endif %}>Inativo</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Nova senha</label>
        <input name="password" class="form-control" type="password">
    </div>
    <div class="mb-3">
        <label class="form-label">Biografia</label>
        <textarea name="bio" class="form-control">{{ user.bio or '' }}</textarea>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
</form>
{% endblock %}
